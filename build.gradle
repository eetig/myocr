plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    // 与其他服务保持一致，避免 IDEA / 服务器 JDK 版本不一致导致 UnsupportedClassVersionError
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:2025.0.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 腾讯云 SDK：文档抽取（多模态版）ExtractDocMulti
    implementation 'com.tencentcloudapi:tencentcloud-sdk-java-ocr:3.1.1289'

    // ============================================================
    // 服务本身不依赖 MinIO / 数据库 —— 保持无状态，图片由调用方传入。
    // 新增其他厂商引擎时，在此追加对应 SDK 即可。
    // ============================================================
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    // 源码含中文（提示文案），必须 UTF-8
    options.encoding = 'UTF-8'
}

// 禁用普通 jar：build/libs 下只留一个可执行 jar，Dockerfile 的 COPY 才不会歧义
tasks.named('jar') {
    enabled = false
}

bootJar {
    archiveFileName = 'myocr.jar'
    manifest {
        attributes(
                'Implementation-Title': 'myocr',
                'Implementation-Version': project.version
                // 不写 Build-Time：时间戳会让「源码没变但产物不同」，破坏构建缓存与可复现性。
                // 需要区分构建时，以 jar 的 sha256 或镜像 tag 为准。
        )
    }
}
